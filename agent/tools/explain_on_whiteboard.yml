name: explain_on_whiteboard
description: >-
  Create a spoken, animated whiteboard explanation when the student asks to hear an explanation,
  watch a walkthrough, or use the narrated whiteboard. Pair short plain-language speech with
  reveal cues for a schematic and equation steps. In guided workflow mode, explain the requested steps of the actual problem through to a checked answer. In other modes respect the help ceiling.
  Use only problem givens or quantities verified by tools. Use plot_property_diagram for scaled
  property plots. The app saves and shows the lesson; do not copy its figure or repeat the transcript.
  Audio starts only when the student presses Play; captions and manual steps work without audio.
  Prefer recognizable apparatus illustrations over generic boxes when useful. Surroundings and contents
  must follow the problem; never infer submerged conditions or phase from an apparatus name. Use state
  nodes for numbered inlet/outlet values and arrows for heat, work, and mass. Pair each equation step
  with the corresponding physical feature, using the same state labels. Say what is neglected and why.
  Illustration geometry is schematic; no dimensions, quality, or flow direction are implied by artwork.
status: Preparing a narrated whiteboard
parameters:
  type: object
  additionalProperties: false
  properties:
    board:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, enum: [sketch, solution] }
        title: { type: string, maxLength: 90 }
        nodes:
          type: array
          maxItems: 8
          description: Nodes at 10-90 percent across/down. Illustrated nodes need 29 x or 36 y separation; plain nodes need 23 x or 22 y. Prefer 2-4 illustrated apparatus with equation steps.
          items:
            type: object
            additionalProperties: false
            properties:
              id: { type: string, description: Unique lowercase id starting with a letter. }
              label: { type: string, maxLength: 48 }
              kind: { type: string, enum: [component, state, boundary, note] }
              illustration: { type: string, enum: [piston-cylinder, rigid-tank, turbine, compressor, pump, nozzle, diffuser, heat-exchanger, refrigerator, hose, valve, mixing-chamber, boiler, condenser, immersed-object], description: Optional apparatus cutaway. Choose the actual apparatus in the problem; omit for an abstract state or unsupported device. }
              surroundings: { type: string, enum: [air, water, gas], description: Optional surrounding medium explicitly given in the problem. Water means fully submerged. }
              contents: { type: string, enum: [gas, liquid, two-phase], description: Optional known vessel contents. Supported for piston-cylinder rigid-tank mixing-chamber boiler condenser only. Two-phase is schematic and does not imply quality. }
              boundary: { type: string, enum: [closed-system, control-volume], description: Optional dashed system boundary around this apparatus. Only select after identifying the system. }
              x: { type: integer, minimum: 10, maximum: 90 }
              y: { type: integer, minimum: 10, maximum: 90 }
            required: [id, label, kind, x, y]
        arrows:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            properties:
              from: { type: string }
              to: { type: string }
              label: { type: string, maxLength: 48 }
              kind: { type: string, enum: [flow, heat, work, relationship] }
            required: [from, to, kind]
        steps:
          type: array
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            properties:
              label: { type: string, maxLength: 36 }
              latex: { type: string, maxLength: 180, description: KaTeX without dollar delimiters. }
              note: { type: string, maxLength: 180 }
            required: [label]
      required: [kind, title]
    segments:
      type: array
      minItems: 1
      maxItems: 8
      description: Short spoken steps, at most 2500 characters total. Every board item must be revealed exactly once across all segments.
      items:
        type: object
        additionalProperties: false
        properties:
          speech:
            type: string
            maxLength: 500
            description: One or two short spoken sentences. Write mathematical names and units as spoken words, not LaTeX or markup. No new numerical claims.
          cues:
            type: array
            maxItems: 26
            items:
              type: object
              additionalProperties: false
              properties:
                target:
                  type: string
                  description: 'node:ID, arrow:INDEX, or step:INDEX (indexes start at 0). Reveal both endpoint nodes before an arrow.'
                at:
                  type: number
                  minimum: 0
                  maximum: 0.85
                  description: Fraction through the spoken words to start revealing the item. The browser splits speech at cues and sentence breaks. Sort cues by at; place each cue at the words that introduce its element.
              required: [target, at]
        required: [speech, cues]
  required: [board, segments]
