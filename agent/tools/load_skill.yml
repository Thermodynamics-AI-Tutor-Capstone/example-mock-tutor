# What the model sees for this tool. Edit the wording freely; the code is lib/tools/load_skill.js.
# The list of allowed skill names is filled in automatically from the style's skills.
name: load_skill
description: Load the full instructions for one of your skills. Call this before using a skill.
status: "Loading skill: {name}"
status_default: Loading a skill
parameters:
  type: object
  properties:
    name:
      type: string
      description: The skill name.
  required: [name]
