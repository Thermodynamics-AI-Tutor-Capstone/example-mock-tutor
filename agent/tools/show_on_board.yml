# Structured teaching sketch and equation board; implementation: lib/tools/show_on_board.js.
name: show_on_board
description: >-
  Make a small teaching board with labeled components/states, arrows, and up to six equation or
  reasoning steps. Use for a control-volume sketch, a system boundary, energy flows, or the next
  step in a student's solution. A board is schematic, not to scale. Use plot_property_diagram for
  T-s, P-v, P-h, and T-v plots. Give only quantities already in the problem or checked with tools;
  do not invent values. Guided workflow may show the requested solution steps. The result
  contains validated board data. The app shows the board immediately when this tool succeeds;
  continue with a concise explanation or optional check-in and do not copy the figure block.
  Prefer recognizable apparatus illustrations over generic boxes when useful. Surroundings and contents
  must follow the problem; never infer submerged conditions or phase from an apparatus name. Use state
  nodes for numbered inlet/outlet values and arrows for heat, work, and mass. Pair each equation step
  with the corresponding physical feature, using the same state labels. Say what is neglected and why.
  Illustration geometry is schematic; no dimensions, quality, or flow direction are implied by artwork.
status: Showing on board
parameters:
  type: object
  additionalProperties: false
  properties:
    kind:
      type: string
      enum: [sketch, solution]
      description: Sketch requires nodes; solution requires steps and may also have nodes.
    title:
      type: string
      maxLength: 90
    nodes:
      type: array
      maxItems: 8
      description: Nodes at 10-90 percent across/down. For illustrated nodes separate by at least 29 x or 36 y units; plain nodes need 23 x or 22 y. Use 2-4 apparatus per board with state nodes and equations.
      items:
        type: object
        additionalProperties: false
        properties:
          id: { type: string, description: Unique lowercase id, such as turbine or state1. }
          label: { type: string, maxLength: 48 }
          kind: { type: string, enum: [component, state, boundary, note] }
          illustration: { type: string, enum: [piston-cylinder, rigid-tank, turbine, compressor, pump, nozzle, diffuser, heat-exchanger, refrigerator, hose, valve, mixing-chamber, boiler, condenser, immersed-object], description: Optional apparatus cutaway. Choose the actual apparatus in the problem; omit for an abstract state or unsupported device. }
          surroundings: { type: string, enum: [air, water, gas], description: Optional surrounding medium explicitly given in the problem. Water means fully submerged. }
          contents: { type: string, enum: [gas, liquid, two-phase], description: Optional known vessel contents. Supported for piston-cylinder rigid-tank mixing-chamber boiler condenser only. Two-phase is schematic and does not imply quality. }
          boundary: { type: string, enum: [closed-system, control-volume], description: Optional dashed system boundary around this apparatus. Only select after identifying the system. }
          x: { type: integer, minimum: 10, maximum: 90 }
          y: { type: integer, minimum: 10, maximum: 90 }
        required: [id, label, kind, x, y]
    arrows:
      type: array
      maxItems: 12
      items:
        type: object
        additionalProperties: false
        properties:
          from: { type: string, description: Source node id. }
          to: { type: string, description: Destination node id. }
          label: { type: string, maxLength: 48, description: Short label such as mass flow, Q, or W. }
          kind: { type: string, enum: [flow, heat, work, relationship] }
        required: [from, to, kind]
    steps:
      type: array
      maxItems: 6
      description: Ordered lines already justified by the student or current help level.
      items:
        type: object
        additionalProperties: false
        properties:
          label: { type: string, maxLength: 36, description: E.g. Known, Assumptions, Energy balance. }
          latex: { type: string, maxLength: 180, description: Optional KaTeX equation, no $ delimiters. }
          note: { type: string, maxLength: 180, description: Optional plain-language explanation. }
        required: [label]
  required: [kind, title]
