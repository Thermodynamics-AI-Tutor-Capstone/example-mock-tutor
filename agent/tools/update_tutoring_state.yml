# What the model sees for this tool. Edit the wording freely; the code is lib/tools/update_tutoring_state.js.
# Only styles with state.help_ladder: true should list this tool.
name: update_tutoring_state
description: >-
  Record what happened in this conversation so the next turn continues from here: name the problem
  being worked on, the rung you used, a misconception you confirmed or saw repaired, an assumption
  the student committed to or retracted, or that the problem is finished or parked. You cannot move
  the help ceiling, add attempts or reset the ladder with this tool — the server does that from its
  own read of the student. Call it when one of these changes, not every turn.
status: Updating tutoring state
parameters:
  type: object
  properties:
    problem:
      type: string
      description: >-
        One line naming the problem being worked on. Set it when the tutoring state says the problem
        is new and not named yet. Renaming never resets the ladder.
    rung:
      type: integer
      minimum: 0
      description: The help rung you used this turn. Anything above this turn's ceiling is recorded as the ceiling.
    problem_status:
      type: string
      enum: [working, finished, parked]
      description: >-
        "finished" only when the final answer is the student's own and they have already answered your justification and recognition questions. Never in the same reply that asks them. The server refuses "finished" before the student has made a complete attempt.
        "parked" when the student stops mid-problem and wants to come back to it.
    diagnosed_misconception:
      type: string
      description: >-
        A misc card id the student's answer has CONFIRMED (not merely suspected), e.g.
        "misc:m15-adiabatic-implies-isentropic". Also written to the student's long-term model.
    resolved_misconception:
      type: string
      description: A misc card id the student has now repaired and passed a re-test on. Also written to the student's long-term model.
    ledger_entry:
      type: object
      description: One assumption the student committed to or retracted.
      properties:
        assumption:
          type: string
          description: e.g. "adiabatic", "steady flow", "ΔKE ≈ 0", "reversible".
        status:
          type: string
          enum: [stated, assumed, derived, retracted]
        justification:
          type: string
          description: The words in the problem, or the reasoning, that license it.
      required: [assumption, status]
