# Fixed Python plotting program with browser animation and a sequential drawing checklist.
name: grapher
description: >-
  Teach how to draw a thermodynamic diagram using the problem's verified numbers. Python creates
  an annotated plot; the browser progressively draws axes, phase boundaries, critical point,
  labeled states and directed process curves in sync with an expandable exam-order checklist.
  Supports Pv, Ts, Ph, Hs, PT and Tv for water and R-134a. PT uses a liquid-vapor coexistence curve,
  not a dome. Two independent properties are required for each uniquely labeled state. Never
  invent missing givens or contradictory process constraints. The figure is inserted automatically;
  do not copy its block into the reply. This teaches graph construction; it does not check uploaded
  graphs. Available in the local experiment with its configured Python plotting runtime.
status: "Building the {type} drawing walkthrough"
status_default: Building a drawing walkthrough
parameters:
  type: object
  properties:
    fluid:
      type: string
      enum: [water, R-134a]
    type:
      type: string
      enum: [Ts, Pv, Ph, Hs, PT, Tv]
      description: Which diagram to draw.
    title:
      type: string
      description: Optional short caption, such as "Ideal Rankine cycle".
    states:
      type: array
      minItems: 1
      maxItems: 12
      description: >-
        The states to plot. Each needs a label and exactly two independent properties, as in
        property_lookup (T °C, P kPa, x, v m³/kg, u and h kJ/kg, s kJ/(kg·K)).
      items:
        type: object
        properties:
          label:
            type: string
          T:
            type: number
          P:
            type: number
          x:
            type: number
          v:
            type: number
          u:
            type: number
          h:
            type: number
          s:
            type: number
        required: [label]
    processes:
      type: array
      maxItems: 16
      description: Lines to draw between states, in order.
      items:
        type: object
        properties:
          from:
            type: string
            description: Label of the starting state.
          to:
            type: string
            description: Label of the end state.
          path:
            type: string
            enum: [isobaric, isentropic, isothermal, isochoric, isenthalpic, straight]
            description: >-
              How the property changes along the way. isenthalpic is a throttling valve. straight
              draws a dashed line for a process whose path is not known, such as an irreversible
              one.
        required: [from, to, path]
    isobars:
      type: array
      maxItems: 6
      items:
        type: number
      description: Optional constant-pressure lines (kPa) drawn across the whole diagram, such as the boiler and condenser pressures.
  required: [fluid, type, states]
