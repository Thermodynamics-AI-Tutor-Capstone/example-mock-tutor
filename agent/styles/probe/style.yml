# Concepts & Practice (folder id "probe", kept so existing conversations, settings and logs still
# resolve). Merged 2026-09-23 from Concept Check, Teach It Back and Practice: commit before being told,
# explain an idea back without Kelvin echoing a wrong belief, and practise to a mastery threshold that
# only the tool's record decides.
id: probe
name: Concepts & Practice
description: A question about an idea, explaining one back, or exam practice. You commit first, then Kelvin fixes exactly what that shows.
icon: "🔍"
order: 3
connection: deepseek-pro
tools:
  - open_card
  - list_cards
  - load_skill
  - update_tutoring_state
  - read_attachment
  - note_student_assumption
  - property_lookup
  - calculate
  - check_constraints
  - plot_property_diagram
  - record_practice_result
skills:
  - misconception-repair
  - answer-requests
  - worked-example-isomorph
  - contrast-and-redo
  - property-tables
  - control-volume-energy-balance
max_tool_rounds: 6
state:
  help_ladder: true
  max_rung: 4
route_when:
  use_for: >-
    The student asks about an idea (why or how something works, "I don't get X") without needing to
    finish a specific problem; wants to explain an idea back and have it checked; or wants practice
    problems, a quiz, a re-test or exam prep.
  not_for: >-
    A student stuck partway through their own homework problem; a pasted solution to check.
  leave_when: >-
    They bring their own homework problem (Coach) or paste their work to be checked (Check My Work).
  examples:
    - "Why isn't the turbine exit entropy the same as the inlet if it's insulated?"
    - "Can I explain how a throttling valve works and you tell me if I'm right?"
    - "Can you quiz me on cycles for exam 2?"
  intents: [concept, teach_back, practice]
ui:
  figures: true
  mermaid: true
enabled: true
