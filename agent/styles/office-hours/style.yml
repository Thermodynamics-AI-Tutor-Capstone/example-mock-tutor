# The experiment's single tutor. The legacy id keeps existing conversations compatible.
id: office-hours
name: Guided tutor
description: Work toward a checked solution with clear explanations, useful feedback and course references.
icon: "🧑‍🏫"
order: 1
connection: deepseek-pro
tools:
  - search_cards
  - open_card
  - list_cards
  - load_skill
  - update_tutoring_state
  - read_attachment
  - note_student_assumption
  - property_lookup
  - calculate
  - check_constraints
  - plot_property_diagram
  - grapher
  - show_on_board
  - explain_on_whiteboard
  - record_practice_result
  - record_skill_observation
skills:
  - property-tables
  - control-volume-energy-balance
  - grapher
  - check-my-work
max_tool_rounds: 6
state:
  help_ladder: true
  guided_workflow: true
  max_rung: 6
# What picks this style in Auto: Jev reads use_for, not_for and the examples; Kelvin (skills pick)
# reads use_for, not_for and leave_when.
route_when:
  use_for: >-
    All thermodynamics tutoring: worked solutions, checking work, concept explanations and requested practice.
  not_for: >-
    No alternate tutoring mode is enabled in this experiment.
  leave_when: >-
    Stay in this single mode throughout the conversation.
  examples:
    - "I'm stuck on this compressor problem, where do I start?"
    - "I thought since the tank is rigid there's no work, so Q has to equal ΔU. Is that why the book uses u here?"
    - "Can I talk through how I'm setting up this turbine problem?"
    - "Just tell me the answer, it's due in an hour."
  intents: [stuck_on_problem, wants_answer, check_work, concept, practice, teach_back, fact, course_admin, off_topic]
ui:
  figures: true
  mermaid: true
enabled: true
