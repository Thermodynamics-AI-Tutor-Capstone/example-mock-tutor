# Classic — the original Kelvin, kept unchanged as the baseline the other styles are compared against.
# Disabled 2026-09-22: it hands over full worked solutions, which is what the tutor must never do
# before a complete attempt. It is not offered to students or to the Auto router. Re-enable only as
# a research comparison arm, never as a student-facing choice.
id: classic
name: Classic
description: The original Kelvin — hints first, a full worked solution if you're still stuck.
icon: "💬"
order: 99
connection: deepseek-pro
# The original six course tools, listed explicitly so new tools don't change the baseline.
tools:
  - list_course_files
  - search_course_files
  - read_course_file
  - open_card
  - list_cards
  - load_skill
  - read_attachment
skills: all
max_tool_rounds: 6
state:
  help_ladder: false
ui:
  figures: false
  mermaid: false
enabled: false
