# ME 300 course taxonomy — the committed spine of Kelvin AI's knowledge brain.
#
# SOURCE: the ME 300 Canvas course Penn State gave this project access to ("AI integration:
# ME 300", Canvas course 2492426), a copy of Dr. Jacqueline O'Connor's Summer 2023 online
# section. Syllabus: agent/raw-course-files/syllabus/ME300_Su23_Syllabus.pdf. Pulled 2026-09-29.
# This replaces the earlier spine, which was transcribed from Penn State's published *sample*
# Fall 2025 syllabus.
#
# Units are the course's own eight lecture modules (M1–M8). Topics are its lecture videos, one
# per annotated-slide deck in agent/raw-course-files/lectures/ (M1.1 … M8.15), plus the three
# exams and four course-administration rows. `week`, `week_dates` and `reading` come from the
# syllabus's Course Schedule, which gives textbook chapters per WEEK, not per video: `reading`
# is that week's reading (`scope: week`), not a claim that this video maps to exactly those
# sections. M2.9 appears in no week of the schedule; it is placed in week 2, between M2.8 and M3.1.
#
# ⚠ Dates are Summer 2023. A student in another term has other dates. Kelvin must never quote a
#   date or deadline from here as the student's own schedule.
#
# The pipeline (scripts/kb/*) treats `units` and `topics` as a CLOSED ENUM. A card that cannot
# be placed on one of these ids must say `unassigned`; it must never invent an id.

version: 2

course:
  id: course:me300
  code: ME 300
  title: Engineering Thermodynamics
  institution: Penn State
  department: Mechanical Engineering
  term: Summer 2023 (online, asynchronous, 12 weeks)
  instructor: Dr. Jacqueline O'Connor
  description: >-
    Thermodynamics concepts, properties of pure substances, and the first and second law
    analysis of systems and control volumes.
  prerequisites_text: CHEM 110 and MATH 141
  textbook:
    key: turns-pauley-2e
    title: Thermodynamics — Concepts and Applications
    authors: Stephen R. Turns; Laura L. Pauley
    edition: 2nd
    publisher: Cambridge University Press
    year: 2020
  grading:
    homework_percent: 25
    explained_examples_percent: 15
    quizzes_percent: 20
    exams_percent: 40
    note: Lowest homework and two lowest quizzes dropped (Summer 2023 syllabus).
  source:
    path: syllabus/ME300_Su23_Syllabus.pdf
    kind: course syllabus (Summer 2023)

# ---------------------------------------------------------------------------------------
# Closed enums. Every frontmatter field that names one of these must use a value from here.
# ---------------------------------------------------------------------------------------
enums:
  # How much human checking a card has had. Surfaced to the model and badged in the UI.
  status:
    - auto              # written by an LLM from course files; no human has read it
    - draft             # written by a human, but not checked by anyone who teaches ME 300
    - reviewed          # a project human read it end to end and vouches for it
    - instructor-verified  # an ME 300 instructor or TA confirmed it

  audience:
    - model             # useful to the tutor, not shown to students
    - student           # shown to students, not loaded by the tutor
    - both              # default

  kc_type: [fact, skill, principle]

  bloom: [remember, understand, apply, analyze, evaluate, create]

  # What a chunk of a course file IS, semantically. Assigned by the classify stage.
  content_type:
    - lecture
    - worked_example
    - derivation
    - definition
    - statement_of_law
    - data_table
    - problem
    - policy

  misconception_tier: [primary, secondary]

  # What a lecture row in the schedule actually is. `admin` is not a lecture row at all: it is
  # the course-administration unit (unit:u0-course-admin), whose topics exist so that syllabus
  # sections have somewhere to classify to instead of falling into `unassigned`.
  topic_kind: [lecture, examples, exam, admin]

  # `valid_when` / `invalid_when` on equation cards. THIS IS THE HIGHEST-STAKES ENUM in the
  # brain: it is the join that catches the single most common thermo error — right equation,
  # wrong assumptions. Keep it closed and keep it short.
  valid_when:
    - closed-system
    - open-system
    - control-volume
    - isolated-system
    - steady-state
    - steady-flow
    - transient
    - uniform-flow
    - single-inlet-single-exit
    - one-dimensional-flow
    - pure-substance
    - ideal-gas
    - constant-specific-heats
    - variable-specific-heats
    - incompressible
    - compressed-liquid
    - saturated-mixture
    - superheated-vapor
    - reversible
    - internally-reversible
    - irreversible
    - quasi-equilibrium
    - adiabatic
    - isothermal
    - isobaric
    - isochoric
    - isentropic
    - polytropic
    - throttling
    - negligible-kinetic-energy
    - negligible-potential-energy

# ---------------------------------------------------------------------------------------
# Solution format. The syllabus does not prescribe one. This is the structure the instructor's
# posted homework and exam solutions use (agent/raw-course-files/assignments/**/*Solutions*),
# recorded so worked-example cards can reveal it one step at a time.
# ---------------------------------------------------------------------------------------
problem_format:
  source: observed in the instructor's posted homework and exam solutions (Summer 2021–2023)
  fields:
    - id: given
      label: GIVEN
      prompt: The known values from the problem statement, with units.
    - id: find
      label: FIND
      prompt: What the problem asks for.
    - id: assume
      label: ASSUME
      prompt: >-
        Each modelling assumption, stated (ideal gas, constant specific heats, steady flow,
        ΔKE = ΔPE = 0, quasi-equilibrium, rigid, adiabatic …). Solutions award a point for each.
    - id: sketch
      label: SKETCH
      prompt: The system or control volume, and a process diagram (P-v, T-v, T-s) where useful.
    - id: analysis
      label: ANALYSIS
      prompt: >-
        State by state: fix each state from two independent properties and look up the rest;
        then write the conservation equation for the system or control volume, cancel terms
        using the assumptions, and solve with units.
    - id: answer
      label: ANSWER
      prompt: Box the final answer, with units.
  note: >-
    Solutions award partial credit for each assumption and each state, so Kelvin should push a
    student to write these steps rather than jump to a number.

# ---------------------------------------------------------------------------------------
# Course outcomes, verbatim from the Summer 2023 syllabus, numbered as there.
# ---------------------------------------------------------------------------------------
course_outcomes:
  - {id: '1', text: 'Obtain thermodynamic data necessary to solve thermodynamic problems and when necessary use appropriate approximations. These skills include the use of equations of state and/or tabulated property tables.'}
  - {id: '2', text: 'Write the First Law of Thermodynamics in both appropriate forms for both closed system and control volume problem.'}
  - {id: '3', text: 'Solve problems requiring First Law analysis that produce a simple single answer.'}
  - {id: '4', text: 'Make appropriate assumptions when applying the First Law to a "real-world" problem.'}
  - {id: '5', text: 'Write the Second Law of Thermodynamics in the appropriate forms for both closed system and control volume problem.'}
  - {id: '6', text: 'Apply the Second Law to determine the performance limitations of a given thermodynamic system.'}
  - {id: '7', text: 'Apply thermodynamic concepts to describe the performance of the individual components of an engineering system, e.g. a power plant, a jet engine, and then relate that information to the overall performance of the entire system.'}
  - {id: '8', text: 'Physically interpret and apply integrals and derivatives to solve thermodynamic problems.'}
  - {id: '9', text: 'Translate complex word problems into an orderly and logical problem-solving approach.'}

# Exams (Summer 2023): open book, open note, 1.5 h synchronous on Zoom, then 15 min to upload.
exams:
  - {id: exam-1, title: Exam 1, date: '2023-06-22', covers: 'M1.1–M5.8'}
  - {id: exam-2, title: Exam 2, date: '2023-07-20', covers: 'M6.1–M7.15'}
  - {id: final, title: Final exam (Exam 3), date: '2023-08-11', covers: 'M8.1–M8.15', note: Not cumulative, per the syllabus.}

# ---------------------------------------------------------------------------------------
# UNITS = the eight lecture modules, plus one non-module unit for course administration.
# ---------------------------------------------------------------------------------------
units:
  - id: unit:u0-course-admin
    title: Course administration
    exam: null
    note: >-
      Not a lecture module. Holds the syllabus, schedule, grading, assignment types and
      logistics of the Summer 2023 section.
  - id: unit:m1-introduction-and-conservation
    title: 'Module 1 — Introduction, systems and control volumes, conservation principles'
    module: 1
    exam: exam-1
    topic_count: 5
  - id: unit:m2-properties-states-and-processes
    title: 'Module 2 — Properties, states, processes, cycles, equilibrium and assumptions'
    module: 2
    exam: exam-1
    topic_count: 9
  - id: unit:m3-ideal-and-nonideal-gases
    title: 'Module 3 — Ideal-gas P-v-T and calorific equations of state; non-ideal gases'
    module: 3
    exam: exam-1
    topic_count: 8
  - id: unit:m4-phase-change-and-property-tables
    title: 'Module 4 — Phase change, the vapor dome, determining phase, liquids and solids'
    module: 4
    exam: exam-1
    topic_count: 6
  - id: unit:m5-energy-heat-work-closed-systems
    title: 'Module 5 — Energy, heat and work; energy conservation for closed systems'
    module: 5
    exam: exam-1
    topic_count: 9
  - id: unit:m6-control-volumes-and-devices
    title: 'Module 6 — Mass and steady-flow energy conservation; nozzles, throttles, heat exchangers, compressors, turbines'
    module: 6
    exam: exam-2
    topic_count: 10
  - id: unit:m7-second-law-and-entropy
    title: 'Module 7 — Second law, heat engines, Carnot, entropy, isentropic relations and efficiencies'
    module: 7
    exam: exam-2
    topic_count: 16
  - id: unit:m8-power-and-refrigeration-cycles
    title: 'Module 8 — Heat-engine cycles; Rankine, vapor-compression, Brayton, gas-turbine, Otto and Diesel'
    module: 8
    exam: final
    topic_count: 16

