# ME 300 course taxonomy — the committed spine of Kelvin AI's knowledge brain.
#
# SOURCE: Penn State Department of Mechanical Engineering, published SAMPLE syllabus,
#         "ME 300 Engineering Thermodynamics, Fall 2025".
#         https://www.me.psu.edu/assets/docs/sample-syllabus/ME-300.pdf
#         Retrieved 2026-09-17. Structure transcribed by hand; no prose copied.
#
# ⚠ THIS IS THE PUBLISHED *SAMPLE* SYLLABUS. The section Lance's team actually targets may
#   differ — different instructor, different dates, different lecture ordering, possibly a
#   different textbook edition. Every unit, topic, date and reading reference below is
#   "from the published sample syllabus — confirm against your section" until someone checks
#   it against the live Canvas site.
#
# ⚠ Nothing here was written by an LLM. It is a hand transcription of a public document's
#   table of contents. What it is NOT is a claim that these are the right learning units —
#   it is the course's own partition (its five exam blocks), which is the best available
#   prior and not an invention of ours.
#
# The pipeline (scripts/kb/*) treats `units` and `topics` as a CLOSED ENUM. A classifier
# that cannot place a section into one of these ids must emit `topic: unassigned` and
# propose a new topic in the PR body. It must never invent an id.

version: 1

course:
  id: course:me300
  code: ME 300
  title: Engineering Thermodynamics
  institution: Penn State
  department: Mechanical Engineering
  term_of_sample: Fall 2025
  description: >-
    Engineering Thermodynamics I. Basic thermodynamics concepts, properties of pure
    substances, first and second law analysis of systems and control volumes.
  prerequisites_text: CHEM 110 and MATH 141
  textbook:
    key: turns-pauley-2e
    title: Thermodynamics — Concepts and Applications
    authors: Stephen R. Turns; Laura L. Pauley
    edition: 2nd
    publisher: Cambridge University Press
    year: 2020
    # Correction worth carrying: the official sample syllabus uses Turns & Pauley, NOT
    # Cengel. Most thermo material on the open internet assumes Cengel, so a bare
    # "Chapter 3" reference is ambiguous and is forbidden in card frontmatter — always
    # {textbook: turns-pauley-2e, section: "..."}.
  grading_from_sample_syllabus:
    homework_percent: 50
    exams_percent: 50
    note: >-
      From the published sample syllabus. Do not quote as this section's policy without
      confirming against the live Canvas site.
  source:
    url: https://www.me.psu.edu/assets/docs/sample-syllabus/ME-300.pdf
    title: ME 300 Engineering Thermodynamics — Sample Syllabus (Fall 2025)
    retrieved: '2026-09-17'
    kind: published sample syllabus

# ---------------------------------------------------------------------------------------
# Closed enums. Every frontmatter field that names one of these must use a value from here.
# CI rejects anything else, so a wrong answer is a wrong bucket (visible in a diff) rather
# than a phantom bucket that silently becomes an identifier.
# ---------------------------------------------------------------------------------------
enums:
  # How much human checking a card has had. Surfaced to the model and badged in the UI.
  status:
    - auto              # written by an LLM from course files; no human has read it
    - draft             # written by a human, but not checked by anyone who teaches ME 300
    - reviewed          # a project human read it end to end and vouches for it
    - instructor-verified  # an ME 300 instructor or TA confirmed it

  audience:
    - model             # useful to the tutor, not shown to students
    - student           # shown to students, not loaded by the tutor
    - both              # default

  kc_type: [fact, skill, principle]

  bloom: [remember, understand, apply, analyze, evaluate, create]

  # What a chunk of a course file IS, semantically. Assigned by the classify stage.
  content_type:
    - lecture
    - worked_example
    - derivation
    - definition
    - statement_of_law
    - data_table
    - problem
    - policy

  misconception_tier: [primary, secondary]

  # What a lecture row in the schedule actually is. `admin` is not a lecture row at all: it is
  # the course-administration unit (unit:u0-course-admin), whose topics exist so that syllabus
  # sections have somewhere to classify to instead of falling into `unassigned`.
  topic_kind: [lecture, examples, exam, admin]

  # `valid_when` / `invalid_when` on equation cards. THIS IS THE HIGHEST-STAKES ENUM in the
  # brain: it is the join that catches the single most common thermo error — right equation,
  # wrong assumptions. Keep it closed and keep it short.
  valid_when:
    - closed-system
    - open-system
    - control-volume
    - isolated-system
    - steady-state
    - steady-flow
    - transient
    - uniform-flow
    - single-inlet-single-exit
    - one-dimensional-flow
    - pure-substance
    - ideal-gas
    - constant-specific-heats
    - variable-specific-heats
    - incompressible
    - compressed-liquid
    - saturated-mixture
    - superheated-vapor
    - reversible
    - internally-reversible
    - irreversible
    - quasi-equilibrium
    - adiabatic
    - isothermal
    - isobaric
    - isochoric
    - isentropic
    - polytropic
    - throttling
    - negligible-kinetic-energy
    - negligible-potential-energy

# ---------------------------------------------------------------------------------------
# The mandated six-part solution schema. Transcribed verbatim-in-structure from the
# syllabus section "Problem Format (homework, exams)". Every worked example card carries
# these as structured fields so the socratic-coaching skill can mask them one at a time.
# ---------------------------------------------------------------------------------------
problem_format:
  source: published sample syllabus, "Homework, Lecture Videos, & Lecture Notes" and "Problem Format (homework, exams)"
  fields:
    - id: known
      label: KNOWN
      prompt: List properties, variables, etc. given in the problem.
    - id: find
      label: FIND
      prompt: What is unknown that we are asked to find.
    - id: sketch
      label: SKETCH
      prompt: Schematic diagram and relevant graphs (P-v, T-s diagrams, etc.).
    - id: assumptions
      label: ASSUMPTIONS
      prompt: These need to be justified if they are atypical.
    - id: analysis
      label: ANALYSIS
      prompt: Solve the problem, step-by-step, and always include units. Box the final answer.
    - id: sanity_check
      label: SANITY CHECK
      prompt: >-
        Miscalculations can lead to unrealistic results. Indicate if you feel that your
        answer is not realistic.
  note: >-
    The syllabus states this format twice and adds that "the most important thing is that
    the solution method is coherent and systematic". Kelvin should use these six headings
    for any full worked solution.

# ---------------------------------------------------------------------------------------
# Course objectives (A–F) and outcomes (1–10), with the ABET program-outcome mapping the
# syllabus prints in brackets. Transcribed from "Course Objectives and Outcomes".
# ---------------------------------------------------------------------------------------
course_objectives:
  - id: A
    text: Appreciate the role of thermodynamics in engineering and society.
    program_outcomes: ['3c']
  - id: B
    text: Understand the importance of thermodynamic properties and know how to use them.
    program_outcomes: ['2b']
  - id: C
    text: >-
      Understand the First Law of Thermodynamics and know how to use it to solve
      engineering problems.
    program_outcomes: ['2b']
  - id: D
    text: >-
      Understand the Second Law of Thermodynamics and know how to use it to solve
      engineering problems.
    program_outcomes: ['2b']
  - id: E
    text: >-
      Apply the First and Second Laws to practical systems, including Rankine cycles,
      refrigeration cycles and gas cycles.
    program_outcomes: ['2e']
  - id: F
    text: Develop fundamental engineering problem solving skills.
    program_outcomes: ['4d']

course_outcomes:
  - id: '1'
    text: >-
      Obtain thermodynamic data necessary to solve thermodynamic problems and when
      necessary use appropriate approximations. These skills include the use of equations
      of state and/or tabulated property tables.
    objectives: [B]
  - id: '2'
    text: >-
      Write the First Law of Thermodynamics in their appropriate forms for both closed
      system and control volume problem.
    objectives: [C]
  - id: '3'
    text: Solve problems requiring First Law analysis that produce a simple single answer.
    objectives: [C]
  - id: '4'
    text: Make appropriate assumptions when applying the First Law to a "real-world" problem.
    objectives: [C]
  - id: '5'
    text: >-
      Write the Second Law of Thermodynamics in their appropriate forms for both closed
      system and control volume problem.
    objectives: [D]
  - id: '6'
    text: >-
      Apply the Second Law to determine the performance limitations of a given
      thermodynamic system.
    objectives: [D]
  - id: '7'
    text: >-
      Apply thermodynamic concepts to describe the performance of the individual components
      of an engineering system, e.g. a power plant, a jet engine, etc., and then relate that
      information to the overall performance of the entire system.
    objectives: [E]
  - id: '8'
    text: Physically interpret and apply integrals and derivatives to solve thermodynamic problems.
    objectives: [F]
  - id: '9'
    text: Translate complex word problems into an orderly and logical problem solving approach.
    objectives: [F]
  - id: '10'
    text: Use software to solve thermodynamics problems.
    objectives: [F]

program_outcomes:
  - id: '2b'
    text: Analysis of thermal/fluids components
    assessed_for_program_assessment: true
  - id: '2e'
    text: Analysis of thermal/fluids systems
    assessed_for_program_assessment: true
  - id: '3c'
    text: Contemporary issues
    assessed_for_program_assessment: true
  - id: '4d'
    text: >-
      Develop models and choose appropriate tools to implement, solve, and present those
      models
    assessed_for_program_assessment: false

# ---------------------------------------------------------------------------------------
# UNITS = the five exam blocks, plus one non-syllabus unit for course administration.
# The five are the course's OWN partition of the material, read straight off the lecture
# schedule (an exam closes each block). We did not invent them.
# `lectures: [first, last]` is inclusive and includes the exam lecture itself.
#
# unit:u0-course-admin is ours, and it is deliberately NOT one of the exam blocks. Without
# it there is no id a syllabus section can classify to: exam dates, the late policy, grade
# weights and office hours all land on `unassigned` and produce no card at all. Those are
# exactly the questions where a wrong answer is unambiguously a lie to a student, so they
# need a card path. The unit is an EMPTY SHELF: no date, deadline, weight or policy is
# known here until a real syllabus is uploaded into agent/raw-course-files/.
# ---------------------------------------------------------------------------------------
units:
  - id: unit:u0-course-admin
    title: Course administration
    exam: null
    exam_lecture: null
    lectures: null
    reading_span: null
    topic_count: 4
    note: >-
      Not a syllabus unit. Added so that administrative sections of an uploaded syllabus
      have somewhere to classify to. Nothing about this section's dates, deadlines,
      grading or policy is known until the team uploads the real syllabus.

