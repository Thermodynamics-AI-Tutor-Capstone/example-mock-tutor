not_transcribed:
  - what: Instructor and TA names, e-mail addresses, office numbers and office hours
    why: >-
      Personal contact details of people who have not agreed to be in a public repo, and
      near-certain to differ from the live section. Kelvin should tell a student to check
      Canvas.
  - what: Grading scale cutoffs, late-drop rules, make-up-exam and grade-appeal policy
    why: >-
      Policy text from a SAMPLE syllabus. Repeating it as this section's policy is exactly
      the "never invent course policy" failure. Only the 50/50 homework/exam split is kept,
      and it is labelled as sample-syllabus-derived.
  - what: Academic-integrity, classroom-rules and disability-accommodation statements
    why: >-
      University boilerplate, not course knowledge, and long. Kelvin should point at the
      published PSU pages rather than paraphrase them.
  - what: Class time and location
    why: Section-specific and certain to be wrong for another section.
