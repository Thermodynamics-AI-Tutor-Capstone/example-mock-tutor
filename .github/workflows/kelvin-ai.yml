name: Kelvin AI — checks

on:
  push:
    branches:
      - main
  # Several sessions work in parallel on their own branches; every pull request into main gets
  # the same checks before it can be merged. Deploys are not done here: the Vercel project is
  # connected to this repository and deploys main itself (and every pull request as a preview).
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: kelvin-ai-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  index:
    name: Index course materials
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build knowledge index
        run: npm run knowledge -- --summary "$GITHUB_STEP_SUMMARY"

      # Hard gate. A broken cross-reference in agent/knowledge-brain/ means the model can be
      # handed a card id that resolves to nothing, so this must stop the deploy.
      # No LLM, no API key: it runs on forks too.
      - name: Validate the knowledge base
        run: node scripts/kb/validate.mjs --summary "$GITHUB_STEP_SUMMARY"
      - name: Validate tools and teaching styles
        run: node scripts/validate-agent.mjs --summary "$GITHUB_STEP_SUMMARY"
      - name: Load every server module
        run: node scripts/smoke-imports.mjs
      # Guards the numbers Kelvin gives students: the tables in agent/properties/ are compared
      # against exact CoolProp values and against printed textbook values.
      - name: Check the property tables
        run: node scripts/properties/test.mjs
      - name: Tutor unit tests (policy, decider, agent loop; no network)
        run: npm run agent:test

      - name: Teaching board tool and renderer tests
        run: npm run board:test

      - name: Admin dashboard tests (access, anonymization, eval results)
        run: npm run admin:test

      # Informational. Retrieval quality is a number to watch, not a reason to
      # block a deploy — except for the one regression check the eval itself
      # enforces, which is reported here and does not gate this workflow.
      - name: Offline retrieval eval
        continue-on-error: true
        run: node scripts/kb/eval.mjs --summary "$GITHUB_STEP_SUMMARY"
