<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome — Kelvin AI</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/account.css">
<script src="/account.js"></script>
<style>
  /* The "signed in as" line, used only on this page. */
  .name-field-head { font-size: 14px; }
</style>
</head>
<body class="account-page">
<main class="acct-card">
  <div class="acct-brand">Kelvin AI</div>
  <h1 class="acct-title">Tell Kelvin about you</h1>
  <p class="acct-sub">The course details are optional; they help Kelvin use the right course's examples and notation.</p>
  <form id="form" class="acct-form" novalidate>
    <div class="acct-field">
      <span class="name-field-head">You're signed in as <strong id="asName">…</strong></span>
    </div>
    <div class="acct-section">Your course <span class="opt">(optional)</span></div>
    <div class="acct-row">
      <div class="acct-field"><label for="course_number">Course number</label><input id="course_number" placeholder="ME 300" maxlength="120"></div>
      <div class="acct-field"><label for="section">Section</label><input id="section" placeholder="001" maxlength="120"></div>
    </div>
    <div class="acct-field"><label for="professor">Professor</label><input id="professor" maxlength="120"></div>
    <div class="acct-row">
      <div class="acct-field"><label for="semester">Semester</label><input id="semester" placeholder="Fall 2026" maxlength="120"></div>
      <div class="acct-field"><label for="year">Year</label>
        <select id="year"><option value="">—</option><option>First-year</option><option>Sophomore</option><option>Junior</option><option>Senior</option><option>Graduate</option><option>Other</option></select>
      </div>
    </div>
    <div class="acct-field"><label for="major">Major</label><input id="major" placeholder="Mechanical Engineering" maxlength="120"></div>
    <div id="error" class="acct-error" role="alert"></div>
    <button id="submit" class="acct-btn" type="submit" disabled>Continue</button>
  </form>
</main>
<script>
(function () {
  const A = window.KelvinAccount;
  const FIELDS = ['course_number', 'section', 'professor', 'semester', 'year', 'major'];
  const $ = (id) => document.getElementById(id);
  A.requireSession({ needProfile: false }).then((me) => {
    if (!me) return;
    if (me.profile && me.profile.onboarded) { location.replace('/'); return; }
    const p = me.profile || {};
    for (const f of FIELDS) if (p[f]) $(f).value = p[f];
    // The student's made-up name is their identity; the server sets the display name, never the form.
    $('asName').textContent = p.username || me.user.name || 'you';
    $('submit').disabled = false;
    $('course_number').focus();
  });
  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = { onboard: true };
    for (const f of FIELDS) body[f] = $(f).value.trim();
    $('submit').disabled = true;
    try {
      await A.saveProfile(body);
      location.replace('/');
    } catch (err) {
      $('error').textContent = err.message;
      $('submit').disabled = false;
    }
  });
})();
</script>
</body>
</html>
