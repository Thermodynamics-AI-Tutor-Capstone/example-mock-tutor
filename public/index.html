<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelvin AI</title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/style.css">
<script src="/vendor/marked.umd.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/katex/katex.min.js"></script>
<script src="/app.js" defer></script>
</head>
<body>
<div id="app" class="app">
  <div id="backdrop" class="backdrop"></div>
  <aside id="sidebar" class="sidebar">
    <div class="sb-top">
      <div class="brand">Kelvin AI</div>
      <button id="closeSidebar" class="icon-btn" title="Close sidebar" aria-label="Close sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <button id="newChatBtn" class="sb-row">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L12 14.8 8 16l1.2-4z"/></svg>
      <span>New chat</span>
    </button>
    <div class="sb-label">Chats</div>
    <nav id="convList" class="conv-list"></nav>
    <div class="sb-user">
      <div class="avatar">ME</div>
      <div class="user-name">Student</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button id="openSidebar" class="icon-btn only-collapsed" title="Open sidebar" aria-label="Open sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>
        <button id="topNewChat" class="icon-btn only-collapsed" title="New chat" aria-label="New chat">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L12 14.8 8 16l1.2-4z"/></svg>
        </button>
        <div class="model-label">Kelvin AI <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
      </div>
    </header>

    <div id="scroller" class="scroller">
      <div id="empty" class="empty">
        <h1 class="empty-title">What can I help with?</h1>
        <div id="emptyComposerSlot" class="composer-slot"></div>
        <div id="chips" class="chips">
          <button class="chip">Explain the first law for an open system</button>
          <button class="chip">Help me find the quality of a saturated mixture</button>
          <button class="chip">Why does entropy generation have to be ≥ 0?</button>
          <button class="chip">Walk me through a Rankine cycle problem</button>
        </div>
      </div>
      <div id="thread" class="thread"></div>
    </div>

    <div id="bottom" class="bottom">
      <button id="scrollDown" class="scroll-down" title="Scroll to bottom" aria-label="Scroll to bottom">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      </button>
      <div id="bottomComposerSlot" class="composer-slot"></div>
      <div class="disclaimer">Kelvin AI can make mistakes. Check important info.</div>
    </div>

    <form id="composer" class="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Ask anything"></textarea>
      <button id="sendBtn" type="submit" class="send-btn" disabled aria-label="Send">
        <svg class="ic-send" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <svg class="ic-stop" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      </button>
    </form>
  </main>
</div>
<div id="gate" class="gate" hidden>
  <form id="gateForm" class="gate-card" autocomplete="off" novalidate>
    <h1 class="gate-title">Kelvin AI</h1>
    <p class="gate-sub">Enter the team passcode to continue</p>
    <input id="gateInput" class="gate-input" type="password" placeholder="Passcode" autocomplete="current-password" aria-label="Passcode" required>
    <div id="gateError" class="gate-error" role="alert" hidden>Incorrect passcode</div>
    <button id="gateBtn" type="submit" class="gate-btn">Continue</button>
  </form>
</div>
</body>
</html>
